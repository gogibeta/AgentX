name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run application and build-logic tests
        run: |
          chmod +x ./gradlew
          ./gradlew -p build-logic test --stacktrace
          ./gradlew :app:testFdroidDebugUnitTest :app:testPlayDebugUnitTest verifyKotlinFileSize --no-daemon --max-workers=1 --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            build-logic/build/reports/tests/
            build-logic/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Job-level so the `if:` conditions below reliably see them (a step's own
    # env block is not visible to that step's `if:`).
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37 ndk;28.2.13676358"

      - name: Restore signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks
          cat >> local.properties <<EOF
          storeFile=${{ github.workspace }}/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Fail if release key is missing
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::KEYSTORE_BASE64 secret is not set. Release builds are fail-closed: refusing to sign with the debug key."
          exit 1

      - uses: gradle/actions/setup-gradle@v4

      - name: Build PRoot runtime
        run: |
          chmod +x ./build-proot.sh
          ./build-proot.sh

      - name: Build F-Droid Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFdroidRelease

      - name: Verify PRoot runtime packaging
        run: |
          apk_path=$(find app/build/outputs/apk/fdroid/release -name '*.apk' -print -quit)
          test -n "$apk_path"
          apk_entries=$(mktemp)
          trap 'rm -f "$apk_entries"' EXIT
          unzip -Z1 "$apk_path" > "$apk_entries"
          for library in libproot_exec.so libproot_loader.so libtalloc.so; do
            entry="lib/arm64-v8a/$library"
            grep -Fxq "$entry" "$apk_entries" || {
              echo "Missing PRoot runtime library: $library" >&2
              exit 1
            }
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agentx-fdroid-release
          path: app/build/outputs/apk/fdroid/release/*.apk

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: agentx-fdroid-release
          path: dist

      - name: Rename APK consistently
        run: |
          apk=$(find dist -name '*.apk' -print -quit)
          test -n "$apk"
          mv "$apk" "dist/AgentX-${{ github.ref_name }}-fdroid-release.apk"
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AgentX-${{ github.ref_name }}-fdroid-release.apk
          generate_release_notes: true
          body: |
            AgentX ${{ github.ref_name }} — signed release APK (F-Droid flavor).

            Install or update without uninstalling (same signing key, same applicationId):
            `adb install -r AgentX-${{ github.ref_name }}-fdroid-release.apk`

            Your API keys, conversations, and settings are preserved across updates.
